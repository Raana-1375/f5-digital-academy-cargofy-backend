services:
  mysql:
    image: mysql:8.0
    container_name: cargofy-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: cargofy_db
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - cargofy_mysql_data:/var/lib/mysql

volumes:
  cargofy_mysql_data: