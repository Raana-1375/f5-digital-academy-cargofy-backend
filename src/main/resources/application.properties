spring.application.name=cargofy-backend

# Secrets are read from environment variables or from the git-ignored .env file
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/cargofy_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.springframework.security=DEBUG

# JWT configuration (the key has no default: set JWT_SECRET in .env)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Demo accounts (password is read from DEMO_PASSWORD or the .env file)
cargofy.demo-password=${DEMO_PASSWORD:}

# Operator registration is only allowed with this code (set it in .env)
cargofy.operator-access-code=${OPERATOR_ACCESS_CODE:}
